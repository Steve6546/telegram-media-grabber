[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-media-grabber"
version = "0.1.0"
description = "Telegram bot that grabs video, audio, image and album media from 1800+ sites using yt-dlp, gallery-dl and FFmpeg."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Steve6546" }]
dependencies = [
    "aiogram>=3.15.0",
    "yt-dlp>=2025.1.15",
    "gallery-dl>=1.26.0",
    "cryptography>=42.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# MTProto upload path: raises the per-file ceiling from 50 MB (Bot API) to 2 GB.
# Kept optional so a plain Bot API deployment does not carry the dependency.
mtproto = ["telethon>=1.34.0"]
# aria2c gives segment parallelism + network-resume for large files.
accel = ["aria2p>=0.11.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
grabber = "media_bot.cli:main"

[tool.setuptools.packages.find]
include = ["media_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: tests that hit real public sites (deselected by default, run with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
