name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual runs matter here because the live smoke job depends on third-party sites that
  # change without notice, and because private-repo Actions entitlement can block automatic
  # runs entirely — this is the way to prove the workflow is correct the moment it can run.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # FFmpeg is a hard runtime dependency for merging, conversion and splitting;
      # the processing tests call it for real, so CI must install it.
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg aria2

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check media_bot tests scripts

      - name: Static sanity
        run: python -m compileall -q media_bot scripts

      - name: Unit and integration tests (offline)
        run: python -m pytest -q -m "not live"

      - name: Doctor reports degraded capabilities honestly
        run: grabber doctor | tee doctor.txt
        continue-on-error: true

  live-smoke:
    # Optional and allowed to fail: third-party sites change under us.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e .
      - name: Probe public sample URLs
        run: python scripts/live_probe.py
        continue-on-error: true
